    <line x1="60" y1="-35" x2="30" y2="-15" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.6"/>
    <line x1="60" y1="35" x2="30" y2="15" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.6"/>
